services:
  - type: web
    name: expendios-camarca
    runtime: node
    plan: free
    buildCommand: NODE_OPTIONS="--max-old-space-size=2048" npm install --include=dev && NODE_OPTIONS="--max-old-space-size=2048" npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        value: camarca-expendios-photos-contingency
      - key: S3_BUCKET
        value: camarca-expendios-photos-contingency
      - key: ADMIN_ACCESS_PASSWORD
        sync: false
      - key: ADMIN_MASTER_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
